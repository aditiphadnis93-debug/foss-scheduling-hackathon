# Justice Dimakar: clusterer. Arbitration only; arguments on Mon/Wed,
# appearances on Tue/Thu/Fri; an advocate's matters are pulled onto the same day.
name: Justice Dimakar (clusterer)
courtroom: Court 2
# How the judge describes their way of working (the brief, paraphrased). Only the L3 judge agent reads it.
style: >-
  My priority is reducing the backlog of long-pending arbitration matters. Arguments on some days,
  appearances on others, and an advocate's matters grouped together. Counsel must file a cover page
  summarising agreed facts before arguments; I do not tolerate unprepared adjournment requests.
# Needs a cover page summarising the facts before argument hearings (brief).
cover_page_for: [evidence, final_arguments]
max_cases_per_day: 60
listing_factor: 1.0
clustering: true
rollover: false
case_types: [arbitration]
weights:
  age: 8
blocks:
  - name: "Arguments (morning)"
    start: "11:00"
    end: "13:30"
    purposes: [evidence, final_arguments]
    weekdays: [0, 2]
  - name: "Arguments (afternoon)"
    start: "14:30"
    end: "16:30"
    purposes: [evidence, final_arguments]
    weekdays: [0, 2]
    sort_by: age
  - name: "Appearances (morning)"
    start: "11:00"
    end: "13:30"
    purposes: [admission, mention, interim_application]
    weekdays: [1, 3, 4]
  - name: "Appearances (afternoon)"
    start: "14:30"
    end: "16:30"
    purposes: [admission, mention, interim_application]
    weekdays: [1, 3, 4]

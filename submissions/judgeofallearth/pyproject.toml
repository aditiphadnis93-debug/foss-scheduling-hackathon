[project]
name = "courtsched"
version = "0.1.0"
description = "Scheduling Justice: court scheduling experiment bench (PUCAR hackathon)"
readme = "README.md"
authors = [
    { name = "Akshit Tyagi" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
courtsched = "courtsched.cli:main"
courtsched-story = "courtsched.story:main"

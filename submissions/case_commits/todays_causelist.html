<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Cause List</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --border: #dde1e6;
    --accent: #2f5bd3;
    --bar-sub: #2f5bd3;
    --bar-age: #8a4fd1;
    --bar-cluster: #1f8a8a;
    --bar-time: #c2410c;
    --shadow: 0 10px 40px rgba(15, 20, 30, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --surface: #1a1e24; --surface-2: #232830; --text: #e6e9ed; --muted: #9aa5b1;
      --border: #2e343d; --accent: #7c9cf5; --shadow: 0 10px 40px rgba(0, 0, 0, .6);
      --bar-sub: #7c9cf5; --bar-age: #b98cf0; --bar-cluster: #4cc3c3; --bar-time: #f39a5e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --surface: #1a1e24; --surface-2: #232830; --text: #e6e9ed; --muted: #9aa5b1;
    --border: #2e343d; --accent: #7c9cf5; --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    --bar-sub: #7c9cf5; --bar-age: #b98cf0; --bar-cluster: #4cc3c3; --bar-time: #f39a5e;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin-bottom: 16px; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.time .dur { color: var(--muted); font-size: 12px; margin-left: 6px; }
  tr.case { cursor: pointer; }
  tr.case:hover td { background: var(--surface-2); }
  tr.case:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.break td, tr.gap td { color: var(--muted); font-size: 13px; text-align: center; font-style: italic; }
  tr.break td { background: var(--surface-2); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .score { font-weight: 700; }

  /* Modal */
  dialog {
    width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    padding: 0; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  .m-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  .m-head h3 { margin: 0; font-size: 18px; }
  .m-head .sub { font-size: 13px; margin: 4px 0 0; }
  .m-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .m-section:last-child { border-bottom: 0; }
  .m-section h4 { margin: 0 0 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .facts > div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .facts b { display: block; color: var(--text); font-weight: 600; font-size: 14px; margin-top: 1px; }
  .facts .note-line { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .breakdown { display: grid; grid-template-columns: minmax(150px, 210px) 1fr 60px; gap: 8px 12px; align-items: center; }
  .breakdown .bar-track { background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .breakdown .bar { height: 10px; border-radius: 3px; }
  .breakdown .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .breakdown .lbl { font-size: 13px; color: var(--muted); }
  .breakdown .lbl small { display: block; font-size: 11px; }
  .breakdown .divider { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 4px 0; }
  .breakdown .total { color: var(--text); font-size: 14px; font-weight: 700; }
  .summary { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: var(--surface-2); }
</style>
</head>

// ---------- Helpers ----------
const DAY_MS = 86400000;
const parse = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(parse(s).getTime() + n * DAY_MS));
const isWorking = s => ![0, 6].includes(parse(s).getUTCDay()) && !HOLIDAYS[s];
const onOrAfterWorking = s => { while (!isWorking(s)) s = addDays(s, 1); return s; };
const fmt = s => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const fmtLong = s => parse(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
const fmtTime = m => `${(Math.floor(m / 60) + 11) % 12 + 1}:${String(m % 60).padStart(2, "0")} ${m < 720 ? "AM" : "PM"}`;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
// Case age: months if under a year, otherwise years to one decimal place
const fmtAge = days => {
  if (days < 365) { const m = Math.max(1, Math.floor(days / 30.44)); return `${m} month${m === 1 ? "" : "s"}`; }
  const y = (days / 365).toFixed(1);
  return `${y} year${y === "1.0" ? "" : "s"}`;
};

const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
const PLAN_DATE = onOrAfterWorking(TODAY);  // today, or the next working day if today has no sitting

// Seeded random numbers: the same scores all day, new scores the next day
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(Number(PLAN_DATE.replaceAll("-", "")));

// ---------- Cases and scores ----------
// Score (0–100) = chance of a productive hearing × 55 + case age × 30 + same advocate × 8 − time taken.
// The chance of a productive hearing is random (30–99%), standing in for the model.
// The other three parts come from the case's own data.
const W = { sub: 55, age: 30, cluster: 8, time: 100 };
const DAY_MINUTES = WINDOWS.reduce((m, w) => m + w.end - w.start, 0);
const cases = ROSTER.map(([caseNo, filingNo, filed, adv, stage, type, atStage, held, summary]) => ({
  caseNo, filingNo, filed, adv, stage, type, atStage, held, summary,
  ageDays: Math.round((parse(PLAN_DATE) - parse(filed)) / DAY_MS),
  dur: REF[type].dur,
  p: 0.30 + rand() * 0.69,
}));
const advCount = {};
cases.forEach(c => advCount[c.adv] = (advCount[c.adv] || 0) + 1);
cases.forEach(c => {
  c.parts = {
    sub: c.p * W.sub,
    age: Math.min(c.ageDays / (4 * 365), 1) * W.age,
    cluster: advCount[c.adv] > 1 ? W.cluster : 0,
    time: -(c.dur / DAY_MINUTES) * W.time,
  };
  c.score = Math.round(c.parts.sub + c.parts.age + c.parts.cluster + c.parts.time);
});
const byNo = Object.fromEntries(cases.map(c => [c.caseNo, c]));

// ---------- Today's plan ----------
// Highest score first, each case at the earliest free time that fits
// without running into the lunch break or past 6:00 PM.
function firstFit(dur, booked) {
  for (const w of WINDOWS) {
    let t = w.start;
    while (t + dur <= w.end) {
      const clash = booked.filter(b => b.start < t + dur && t < b.end);
      if (!clash.length) return t;
      t = Math.max(...clash.map(b => b.end));
    }
  }
  return null;
}

const booked = [];
[...cases].sort((a, b) => b.score - a.score).forEach(c => {
  const t = firstFit(c.dur, booked);
  if (t !== null) { c.start = t; c.end = t + c.dur; booked.push(c); }
});
booked.sort((a, b) => a.start - b.start);

// ---------- Table ----------
const $ = id => document.getElementById(id);
$("title").textContent = `Cause list: ${fmtLong(PLAN_DATE)}`;
$("sub").textContent = PLAN_DATE === TODAY
  ? `${booked.length} cases listed today, 10:00 AM – 6:00 PM`
  : `No sitting today. ${booked.length} cases listed for the next working day, 10:00 AM – 6:00 PM`;

let rows = "";
WINDOWS.forEach((w, i) => {
  let t = w.start;
  booked.filter(c => c.start >= w.start && c.start < w.end).forEach(c => {
    if (c.start > t) rows += `<tr class="gap"><td colspan="5">Free: ${fmtTime(t)} – ${fmtTime(c.start)}</td></tr>`;
    rows += `<tr class="case" tabindex="0" data-case="${esc(c.caseNo)}">
      <td class="mono">${esc(c.caseNo)}</td>
      <td>${REF[c.type].label}</td>
      <td class="num">${fmtAge(c.ageDays)}</td>
      <td class="num"><span class="score">${c.score}</span></td>
      <td class="time">${fmtTime(c.start)} – ${fmtTime(c.end)}<span class="dur">(${c.dur} min)</span></td>
    </tr>`;
    t = c.end;
  });
  if (t < w.end) rows += `<tr class="gap"><td colspan="5">Free: ${fmtTime(t)} – ${fmtTime(w.end)}</td></tr>`;
  if (i < WINDOWS.length - 1) rows += `<tr class="break"><td colspan="5">Lunch break · ${fmtTime(BREAK.start)} – ${fmtTime(BREAK.end)}</td></tr>`;
});
$("tbody").innerHTML = rows;

// ---------- Case details window ----------
const modal = $("modal");
function breakdown(c) {
  const years = (c.ageDays / 365).toFixed(1);
  const items = [
    ["Chance of a productive hearing", `${Math.round(c.p * 100)}%`, c.parts.sub, "var(--bar-sub)"],
    ["Case age", `${years} years${c.ageDays >= 4 * 365 ? ", full weight at 4+ years" : ""}`, c.parts.age, "var(--bar-age)"],
    ["Same advocate has another case", advCount[c.adv] > 1 ? `${c.adv} has ${advCount[c.adv]} cases` : "No other cases", c.parts.cluster, "var(--bar-cluster)"],
    ["Time this hearing takes", `${c.dur} of ${DAY_MINUTES} min`, c.parts.time, "var(--bar-time)"],
  ];
  const max = Math.max(...items.map(i => Math.abs(i[2])), 0.01);
  return items.map(([l, note, v, col]) => `
      <div class="lbl">${l}<small>${esc(note)}</small></div>
      <div class="bar-track"><div class="bar" style="width:${Math.abs(v) / max * 100}%;background:${col};opacity:${v < 0 ? .6 : 1}"></div></div>
      <div class="val">${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}</div>`).join("")
    + `<div class="divider"></div><div class="lbl total">Total score</div><div class="total"></div><div class="val total">${c.score}</div>`;
}

function openModal(no) {
  const c = byNo[no];
  const next = onOrAfterWorking(addDays(PLAN_DATE, REF[c.type].gap));
  modal.innerHTML = `
    <div class="m-head">
      <div>
        <h3 id="mTitle" class="mono">${esc(c.caseNo)}</h3>
        <div class="sub">${REF[c.type].label} · Score ${c.score}</div>
      </div>
      <button id="mClose" aria-label="Close">✕</button>
    </div>
    <div class="m-section">
      <h4>Case details</h4>
      <div class="facts">
        <div>Hearing time<b>${fmtTime(c.start)} – ${fmtTime(c.end)}</b><span class="note-line">${c.dur} min</span></div>
        <div>Filing no.<b class="mono">${esc(c.filingNo)}</b></div>
        <div>Filed on<b>${fmt(c.filed)}</b><span class="note-line">${(c.ageDays / 365).toFixed(1)} years ago</span></div>
        <div>Advocate<b class="mono">${esc(c.adv)}</b></div>
        <div>Current stage<b>${esc(c.stage)}</b></div>
        <div>Hearings held<b>${c.held} total</b><span class="note-line">${c.atStage} for ${REF[c.type].label.toLowerCase()}</span></div>
        <div>Recommended next date<b>${fmt(next)}</b><span class="note-line">${REF[c.type].gap}-day gap after today's hearing</span></div>
      </div>
    </div>
    <div class="m-section">
      <div class="breakdown">
        ${breakdown(c)}
      </div>
    </div>`;
  modal.showModal();
}

document.addEventListener("click", e => {
  const tr = e.target.closest("tr.case[data-case]");
  if (tr) openModal(tr.dataset.case);
});
document.addEventListener("keydown", e => {
  const tr = e.target.closest?.("tr.case[data-case]");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openModal(tr.dataset.case); }
});
modal.addEventListener("click", e => {
  if (e.target === modal || e.target.closest("#mClose")) modal.close();
});
</script>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My rules</title>
<link rel="preload" href="fonts/literata-var.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.dataset.theme = localStorage.getItem("causelist.theme") === "dark" ? "dark" : "light";</script>
<link rel="stylesheet" href="app.css">
</head>
<body class="rules-page">
<header class="topbar">
  <div class="topbar-in">
    <span class="brand">Benchtime</span>
    <nav aria-label="Main">
      <a href="/">Tomorrow's list</a>
      <a href="/rules" aria-current="page">My rules</a>
    </nav>
    <button type="button" class="themebtn" id="theme" aria-pressed="false">Dark page</button>
  </div>
</header>

<div class="desk">
  <main class="sheet" id="sheet">
    <p class="loading">Reading your rules...</p>
  </main>
  <aside class="panel" id="panel" aria-label="What this changes"></aside>
</div>

<div class="previewbar" id="previewbar" role="region" aria-label="Check this change" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="rules.js"></script>
</body>
</html>
